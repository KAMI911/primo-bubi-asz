name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: primo-builds
          path: |
            build/*.ptp
            build/*.wav
            build/*.map
          if-no-files-found: error
